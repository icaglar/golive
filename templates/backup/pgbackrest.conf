# golive: pgBackRest example for the dedicated PostgreSQL server (/etc/pgbackrest/pgbackrest.conf, mode 0640 root:postgres).
# Replace the __PLACEHOLDERS__. The cipher passphrase and S3 keys are generated/entered ON THE SERVER (never in git or in chat):
#   openssl rand -base64 32     -> value for repo1-cipher-pass
# This file is the root-only secret file (chmod 0640 root:postgres, so the postgres user can read it and nobody else).
# The passphrase is ALSO escrowed in the owner's password manager: without it the backups cannot be restored.
# (pgBackRest also reads PGBACKREST_REPO1_CIPHER_PASS from the environment if you prefer to keep it out of this file;
# archive_command runs inside PostgreSQL, so the environment route needs it set in the postgres service. Check the pgBackRest docs.)
# Check option names against the pgBackRest docs for your version (pgbackrest.org) before use.
[global]
# repo1: primary S3-compatible bucket (provider/region per profile.data_residency)
repo1-type=s3
repo1-s3-endpoint=__S3_ENDPOINT__
repo1-s3-region=__S3_REGION__
repo1-s3-bucket=__BACKUP_BUCKET__
repo1-path=/pgbackrest/__PROJECT__
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=__CIPHER_PASS__
repo1-s3-key=__S3_KEY__
repo1-s3-key-secret=__S3_KEY_SECRET__
repo1-retention-full=2
repo1-retention-diff=6
# Object lock / immutability: enable bucket Object Lock (where the provider supports it; check provider docs) so a stolen key cannot delete backups.

# repo2 (optional, recommended): the same backups at ANOTHER provider/account, so one suspended or compromised account
# does not take every copy. Uncomment to use; pgBackRest then writes to both repositories.
# repo2-type=s3
# repo2-s3-endpoint=__S3_ENDPOINT_2__
# repo2-s3-region=__S3_REGION_2__
# repo2-s3-bucket=__BACKUP_BUCKET_2__
# repo2-path=/pgbackrest/__PROJECT__
# repo2-s3-uri-style=path
# repo2-cipher-type=aes-256-cbc
# repo2-cipher-pass=__CIPHER_PASS_2__
# repo2-s3-key=__S3_KEY_2__
# repo2-s3-key-secret=__S3_KEY_SECRET_2__
# repo2-retention-full=2

process-max=2
compress-type=zst
start-fast=y
log-level-console=info
log-level-file=detail

[__PROJECT__]
pg1-path=/var/lib/postgresql/16/main
# PostgreSQL side (postgresql.conf, restart needed):
#   archive_mode = on
#   archive_command = 'pgbackrest --stanza=__PROJECT__ archive-push %p'
#   wal_level = replica
# One-time: sudo -u postgres pgbackrest --stanza=__PROJECT__ stanza-create && sudo -u postgres pgbackrest --stanza=__PROJECT__ check
# Restore drill: restore to a scratch server with `pgbackrest --stanza=__PROJECT__ restore` and run a query; record the date in golive.yaml (database.restore_drill).
#
# MySQL / MariaDB variant: pgBackRest is PostgreSQL only. Use Percona XtraBackup (mysql/MariaDB: mariadb-backup) for full+incremental
# physical backups, or `mysqldump --single-transaction --routines --events` for small databases, and pipe the output through
# `age`/`gpg` or restic (see restic.env.example) to an offsite bucket. golive-backup.sh runs any command given in BACKUP_CMD
# and writes the same heartbeat, so BackupTooOld works for MySQL too.
