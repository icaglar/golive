# golive: Dependabot keeps dependencies and pinned GitHub Actions SHAs current. Copy to .github/dependabot.yml.
# Weekly PRs; ci must pass (and the user decides) before anything merges. Merging to main only reaches
# staging; production changes only through the release workflow.
version: 2
updates:
  - package-ecosystem: github-actions    # bumps the SHA-pinned `uses:` lines and their version comments
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: docker            # base images in Dockerfiles (add one entry per directory with a Dockerfile)
    directory: /
    schedule: {interval: weekly}

