# golive migration Job: runs the app's migrate command from the SAME image (same sha tag) as the app.
# Order: applied by the Flux Kustomization "migrate-<env>"; the "app-<env>" Kustomization has
# dependsOn: migrate-<env> and the migrate one has wait: true, so the Deployment only rolls out after the
# Job completed successfully (see ../../flux/kustomizations.yaml). A failed migration blocks the rollout.
#
# Replace __MIGRATE_COMMAND__ with the app's command, e.g. ["npx","prisma","migrate","deploy"],
# ["python","manage.py","migrate"], ["./migrate","up"]. Migrations must be backward compatible with the
# previous release (old pods keep serving while the Job runs).
#
# The Job name is fixed and Jobs are immutable: the Flux Kustomization sets force: true, so a new image tag
# recreates the Job. Do NOT set ttlSecondsAfterFinished (Flux would re-create and re-run the Job).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {app: migrate}
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: migrate
          image: ghcr.io/OWNER/REPO-web:sha-PLACEHOLDER   # the migrate overlay pins the tag
          command: __MIGRATE_COMMAND__
          envFrom:
            - secretRef: {name: app-env}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
