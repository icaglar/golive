# golive overlay: staging. release.yml pins images[].newTag to sha-<commit>; Flux applies it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
images:
  - name: ghcr.io/OWNER/REPO-web
    newTag: sha-PLACEHOLDER   # release.yml pins sha-<commit>; never staging|prod
replicas:
  - name: web
    count: 1
patches:
  - target: {kind: Ingress, name: web}
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.example.com
      - op: replace
        path: /spec/rules/0/host
        value: staging.example.com
  # Staging protection with ingress-nginx, when environments.staging.protection is basic-auth or Cloudflare Access
  # is not available. Uncomment and adapt (check the ingress-nginx docs for your version; snippet annotations
  # are disabled by default in recent releases, then send X-Robots-Tag from the app or the controller config):
  # - target: {kind: Ingress, name: web}
  #   patch: |-
  #     - op: add
  #       path: /metadata/annotations
  #       value:
  #         nginx.ingress.kubernetes.io/auth-type: basic
  #         nginx.ingress.kubernetes.io/auth-secret: staging-basic-auth   # htpasswd secret, key "auth"; create on the cluster, never in git
  #         nginx.ingress.kubernetes.io/auth-realm: "Staging"
  #         nginx.ingress.kubernetes.io/configuration-snippet: |
  #           more_set_headers "X-Robots-Tag: noindex, nofollow";
