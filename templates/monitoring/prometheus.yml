# golive: Prometheus scrape config. Targets are PRIVATE network IPs (database step's golive-net).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node            # node_exporter on every server
    static_configs:
      - targets: ["__APP_PROD_IP__:9100", "__DB_PROD_IP__:9100"]
        labels: {env: prod}
      - targets: ["__APP_STAGING_IP__:9100"]
        labels: {env: staging}

  - job_name: cadvisor        # per-container CPU/memory on app servers
    static_configs:
      - targets: ["__APP_PROD_IP__:8080"]
        labels: {env: prod}

  - job_name: postgres        # postgres_exporter (mysqld_exporter: port 9104)
    static_configs:
      - targets: ["__DB_PROD_IP__:9187"]
        labels: {env: prod}

  - job_name: caddy           # Caddy metrics site on the private IP
    static_configs:
      - targets: ["__APP_PROD_IP__:9180"]
        labels: {env: prod}

  - job_name: app             # the app's own /metrics, if it has one
    static_configs:
      - targets: ["__APP_PROD_IP__:9200"]
        labels: {env: prod}

  - job_name: blackbox_http   # the site as users see it, through Cloudflare
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://__DOMAIN__/", "https://__DOMAIN__/api/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
