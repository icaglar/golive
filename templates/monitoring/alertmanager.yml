# golive: Alertmanager. Telegram by default; e-mail through the mail provider's SMTP (port 587) as an alternative.
# Secrets are read from files in ./secrets (mounted at /etc/alertmanager/secrets), never inlined here.
route:
  receiver: telegram
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Dead-man's switch: the always-firing Watchdog alert is pushed to an external heartbeat service every minute.
    # If it stops arriving, the service (e.g. a heartbeat/cron-monitoring provider; check the provider docs) notifies you out-of-band.
    - matchers: [alertname = "Watchdog"]
      receiver: deadman
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    # Escalation example: critical alerts go to Telegram AND to a second channel (another person, e-mail, on-call service),
    # and repeat hourly until resolved.
    - matchers: [severity = "critical"]
      receiver: telegram
      continue: true
      repeat_interval: 1h
    - matchers: [severity = "critical"]
      receiver: escalation
      repeat_interval: 1h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        chat_id: 0            # __TELEGRAM_CHAT_ID__ (a number)
        send_resolved: true
  - name: deadman
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/deadman_url   # the provider's heartbeat/ping URL, one line, root-only file
        send_resolved: false
        max_alerts: 1
  - name: escalation
    # Example: a second Telegram chat (second admin). Replace with e-mail or an on-call service webhook if you prefer.
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        chat_id: 0            # __ESCALATION_CHAT_ID__ (a number; a group with the second admin)
        send_resolved: true
  # - name: email
  #   email_configs:
  #     - to: __ALERT_EMAIL__
  #       from: alerts@__DOMAIN__
  #       smarthost: <provider SMTP host>:587   # skills/mail/providers.md
  #       auth_username: <provider SMTP user>
  #       auth_password_file: /etc/alertmanager/secrets/smtp_password
